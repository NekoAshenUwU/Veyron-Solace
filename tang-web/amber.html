<body>
<div class="backdrop" aria-hidden="true"></div>
<div id="stage" class="amber-bg" style="box-sizing:border-box;color:#3A2557;font-family:'Noto Sans SC',sans-serif;overflow:hidden">

    L.bursts = h;
    L.petals = [[30, 12, 8, 0, 9], [95, 9, 6, -4, 11], [150, 14, 9, -2, 10], [205, 10, 7, -7, 12], [250, 13, 8, -1, 9.5], [300, 9, 6, -5, 11.5], [345, 12, 8, -8, 10.5], [70, 8, 5, -6, 13], [320, 11, 7, -3, 12.5]]
      .map(function (p) { return '<span class="petal" aria-hidden="true" style="left:' + p[0] + 'px;width:' + p[1] + 'px;height:' + p[2] + 'px;animation-delay:' + (3.2 - p[3] * 0.6).toFixed(1) + 's;animation-duration:' + p[4] + 's"></span>'; }).join('');
    L.motes = [[60, 520, 6, 0], [110, 470, 4, -1.2], [160, 560, 5, -2.5], [220, 500, 7, -0.6], [270, 540, 4, -3.4], [320, 480, 6, -1.8], [90, 380, 5, -4.2], [300, 360, 4, -2.2], [140, 300, 6, -3.8], [250, 280, 5, -0.9], [40, 640, 4, -2.9], [350, 620, 5, -4.6], [190, 640, 6, -1.5], [130, 700, 4, -3.1]]
      .map(function (m) { return '<span class="mote" aria-hidden="true" style="left:' + m[0] + 'px;top:' + m[1] + 'px;width:' + m[2] + 'px;height:' + m[2] + 'px;animation-delay:' + m[3] + 's"></span>'; }).join('');
    L.textPetals = [[70, 13, 9, 3.2], [300, 11, 7, 3.5], [160, 14, 9, 3.9], [240, 10, 7, 4.2], [40, 11, 7, 4.6], [335, 13, 8, 4.9], [120, 9, 6, 5.3], [210, 12, 8, 5.7], [280, 10, 6, 6.2], [95, 12, 8, 6.6]]
      .map(function (t) { return '<span class="text-petal" aria-hidden="true" style="left:' + t[0] + 'px;width:' + t[1] + 'px;height:' + t[2] + 'px;animation-delay:' + t[3] + 's"></span>'; }).join('');
    return L;
  }
  var LISTS = splashLists();

  function showSplash() {
    var host = $('splashHost');
    host.innerHTML = '';
    host.appendChild($('splashTpl').content.cloneNode(true));
    host.querySelectorAll('[data-list]').forEach(function (el) { el.outerHTML = LISTS[el.getAttribute('data-list')]; });
    $('splash').addEventListener('click', enter);
  }

  function chars(el, str, start, step) {
    el.innerHTML = str.split('').map(function (t, i) {
      return '<span class="char" aria-hidden="true" style="animation-delay:' + (start + i * step).toFixed(2) + 's"><span class="glow-violet">' + (t === ' ' ? '&nbsp;' : esc(t)) + '</span></span>';
    }).join('');
  }

  function dayCount() { return Math.floor((Date.now() - START.getTime()) / 864e5); }
  function startCount() {
    var target = dayCount(), el = $('count');
    el.textContent = '0';
    timers.push(setTimeout(function () {
      var t0 = Date.now();
      var iv = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / 1600);
        el.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
        if (p >= 1) clearInterval(iv);
      }, 30);
      timers.push(iv);
    }, 3400));
  }

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return { short: '', full: '' };
    var mm = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return { short: mm + '.' + dd, full: d.getFullYear() + ' · ' + mm + ' · ' + dd };
  }
  function titleOf(m) { return m.title || String(m.content || '').slice(0, 24) || '（没有标题）'; }

  function renderDrops() {
    var recent = memories.slice(0, 5).reverse();
    $('drops').innerHTML = recent.map(function (m, i) {
      var s = SLOTS[i], h = Math.round(s.w * s.ratio), f = fmtDate(m.created_at);
      return '<div class="fi" style="position:absolute;left:' + (s.cx - s.w / 2) + 'px;top:' + (s.stemY - 2) + 'px;width:' + s.w + 'px;animation-delay:' + (4.8 + i * 0.2).toFixed(2) + 's">' +
        '<div class="' + s.swing + '" style="display:flex;flex-direction:column;align-items:center">' +
        '<div style="width:1px;height:' + s.thread + 'px;background:rgba(255,255,255,.85)"></div>' +
        '<button type="button" class="drop-btn" data-i="' + i + '" aria-label="打开记忆：' + esc(titleOf(m)) + '" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">' +
        '<div class="amber-drop ' + s.img + '" style="width:' + s.w + 'px;height:' + h + 'px"></div>' +
        '<span style="padding:2px 8px;border-radius:999px;background:rgba(255,246,252,.78);border:1px solid rgba(255,255,255,.95);font-family:\'Playfair Display\',serif;font-style:italic;font-size:12px;color:#3A2557;white-space:nowrap">' + f.short + '</span>' +
        '</button></div></div>';
    }).join('');
    $('drops').querySelectorAll('.drop-btn').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); openSheet(recent[+b.getAttribute('data-i')], SLOTS[+b.getAttribute('data-i')]); });
    });
  }

  function openSheet(m, s) {
    setLetterMode(false);
    var f = fmtDate(m.created_at);
    $('sTag').textContent = '棠予酿 · ' + (TAGS[m.tag] || m.tag || '记忆');
    $('sTitle').textContent = titleOf(m);
    $('sBody').textContent = m.content || '';
    $('sBody').classList.add('hidden');
    $('readBtn').textContent = '读这一滴 ›';
    $('sDate').textContent = f.full;
    var drop = $('sDrop');
    drop.className = 'amber-drop ' + s.img;
    drop.style.height = Math.round(40 * s.ratio) + 'px';
    $('sheetWrap').classList.remove('hidden');
    $('bottom').classList.add('hidden');
  }
  var letter = '';
  function loadLetter() {
    return fetch(API + '/love_note', { method: 'POST', credentials: 'include' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { letter = (d && d.content) || ''; $('letterDot').classList.toggle('hidden', !letter); })
      .catch(function () { letter = ''; });
  }
  function setLetterMode(on) {
    ['sTitle', 'sFoot'].forEach(function (id) { $(id).classList.toggle('hidden', on); });
    $('sLetter').classList.toggle('hidden', !on);
    $('sDrop').style.visibility = on ? 'hidden' : '';
  }
  function openLetter() {
    setLetterMode(true);
    $('sBody').classList.add('hidden');
    $('sTag').textContent = '予予的信';
    $('sLetter').textContent = letter || '信还在路上，过一会儿再来看看。';
    $('letterDot').classList.add('hidden');
    $('sheetWrap').classList.remove('hidden');
    $('bottom').classList.add('hidden');
  }
  $('letterBtn').addEventListener('click', function (e) { e.stopPropagation(); openLetter(); });
  function closeSheet() { $('sheetWrap').classList.add('hidden'); $('bottom').classList.remove('hidden'); }
  $('scrim').addEventListener('click', closeSheet);
  $('closeSheet').addEventListener('click', closeSheet);
  $('readBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var b = $('sBody'), open = b.classList.toggle('hidden') === false;
    this.textContent = open ? '收起 ‹' : '读这一滴 ›';
  });

  function loadMemories() {
    return fetch(API + '/memories?limit=1000', { credentials: 'include' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (body) {
        var list = Array.isArray(body) ? body : (body.memories || []);
        list.sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
        memories = list;
        $('total').textContent = '熟透的会落进琥珀匣 · 共 ' + list.length + ' 滴';
        renderDrops();
      })
      .catch(function (err) {
        $('status').textContent = '现在翻不到棠予酿（' + err.message + '），稍后再试';
        $('status').classList.remove('hidden');
      });
  }

  function enter() {
    var sp = $('splash');
    if (!sp || sp.classList.contains('splash-out')) return;
    clearTimers();
    sp.classList.add('splash-out');
    var fill = document.createElement('span'); fill.className = 'amber-fill'; fill.setAttribute('aria-hidden', 'true'); sp.appendChild(fill);
    var home = $('home');
    home.classList.add('hidden'); void home.offsetWidth; home.classList.remove('hidden');
    chars($('line1'), '入心成酿 · 时间是器', 1.4, 0.12);
    chars($('line2'), '我们是彼此的回甘', 2.5, 0.08);
    renderDrops();
    startCount();
    timers.push(setTimeout(function () { $('splashHost').innerHTML = ''; }, 1250));
  }
  $('replay').addEventListener('click', function (e) { e.stopPropagation(); clearTimers(); closeSheet(); $('home').classList.add('hidden'); showSplash(); });

  // ---- 点哪儿落花瓣 ----
  stage.addEventListener('click', function (e) {
    var layer = stage.querySelector('.tap-layer'), r = stage.getBoundingClientRect();
    var x = (e.clientX - r.left) * 390 / r.width, y = (e.clientY - r.top) * 844 / r.height;
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px';
    for (var k = 0; k < 11; k++) {
      var a = Math.random() * Math.PI * 2, d = 4 + Math.random() * 26;
      var fall = document.createElement('span'), sway = document.createElement('span'), petal = document.createElement('span');
      fall.className = 'tp-fall'; sway.className = 'tp-sway'; petal.className = 'tp-petal';
      fall.style.cssText = '--ox:' + (Math.cos(a) * d).toFixed(1) + 'px;--oy:' + (Math.sin(a) * d * 0.6).toFixed(1) + 'px;--fy:' + (140 + Math.random() * 90).toFixed(0) + 'px;--dur:' + (4.6 + Math.random() * 1.8).toFixed(2) + 's;--dl:' + (k * 0.11 + Math.random() * 0.1).toFixed(2) + 's';
      sway.style.cssText = '--sx:' + (8 + Math.random() * 12).toFixed(1) + 'px;--sd:' + (1.3 + Math.random() * 0.9).toFixed(2) + 's;animation-delay:-' + (Math.random() * 2).toFixed(2) + 's';
      var w = 8 + Math.random() * 5;
      petal.style.cssText = 'width:' + w.toFixed(1) + 'px;height:' + (w * 0.65).toFixed(1) + 'px;--fd:' + (2.2 + Math.random() * 1.6).toFixed(2) + 's;animation-delay:-' + (Math.random() * 3).toFixed(2) + 's';
      sway.appendChild(petal); fall.appendChild(sway); wrap.appendChild(fall);
    }
    layer.appendChild(wrap);
    setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 9000);
  });

  loadMemories();
  loadLetter();
  showSplash();
})();
</script>
</body>
</html>
